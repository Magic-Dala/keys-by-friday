[project]
name = "keys-by-friday"
version = "0.1.0"
description = "Single-agent Silicon Valley rental search MVP"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2.1.0,<3.0.0",
  "httpx>=0.28,<1.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
